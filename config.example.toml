# ┌─────────────────────────────────────────────────────────────────┐
# │  OLAF — MCP server configuration                               │
# │                                                                 │
# │  This file is for the SERVER only (infrastructure + defaults).  │
# │  Each agent that connects has its own config with:              │
# │    - the MCP server URL  (olaf.url)                             │
# │    - its LLM model + key (litellm.*)                            │
# │    - which ontology to work on (it calls ontology_switch)       │
# │                                                                 │
# │  Agents are fully isolated: each SSE connection gets its own    │
# │  server instance, so concurrent ontology_switch calls never     │
# │  interfere with each other.                                     │
# └─────────────────────────────────────────────────────────────────┘

# ── Qdrant ─────────────────────────────────────────────────────────────────────
# Connection to Qdrant (chunk reading + status tracking). The connection is shared by
# all connected agents; each agent picks its chunk collection in its own config
# (chunk_collection_switch), `collection` / `field_mapping` below are only the defaults.

[qdrant]
url                 = "http://localhost:6333"
# api_key             = "..."           # required if Qdrant has auth enabled
                                         # (or set the QDRANT_API_KEY env var, which takes precedence)
collection          = "chunks"          # default chunk collection (agents can switch)
index_prefix        = "olaf_index"      # semantic index — collections olaf_index_{ontology_id}, olaf_index_seed_{seed_id}

[qdrant.field_mapping]
# Names of the payload fields in your existing collection.
text        = "text"
doc_id      = "doc_id"
chunk_index = "chunk_index"

# ── Oxigraph ───────────────────────────────────────────────────────────────────
# RDF triplestore. All ontologies and seeds are stored here.

[oxigraph]
# HTTP endpoint of the Oxigraph server (embedded/local file mode is not supported).
url = "http://localhost:7878"    # Oxigraph running on this machine
# url = "http://oxigraph:7878"   # Docker service name (docker-compose)

# ── Ontology defaults ──────────────────────────────────────────────────────────
# Default values used when a new connection has not yet called ontology_switch.
# Each agent can override ontology_id at runtime by calling ontology_switch.

[ontology]
base_uri     = "http://olaf.local/ontology#"   # namespace for all generated URIs
name         = "My Ontology"                   # human-readable default name
ontology_id  = "main"                          # default named graph (urn:olaf:main)

# ── Embedding ──────────────────────────────────────────────────────────────────
# Powers concept_semantic_search. Model is downloaded once and cached locally.
# Disable if you don't need semantic dedup (reduces memory usage).

[embedding]
model   = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
# Any model fastembed supports (TextEmbedding.list_supported_models()), plus
# "intfloat/multilingual-e5-small" (384 d) and "intfloat/multilingual-e5-base" (768 d),
# loaded from their ONNX export on Hugging Face (~0.5 GB / ~1.1 GB, downloaded on first start).
# Concepts are indexed when they are created, and an existing index is not recomputed when
# the model changes (vector sizes differ): after changing it, build into a new ontology_id.
enabled = true

# ── Reasoner ───────────────────────────────────────────────────────────────────
# Powers ontology_check (OWL 2 DL consistency + unsatisfiable classes, with
# explanations). Uses the Pellet jars bundled with owlready2; requires Java 11+
# (installed in the Docker image). When disabled or when Java is missing,
# ontology_check still runs its SPARQL integrity checks.

[reasoner]
enabled         = true
java            = "java"   # path to the java executable
memory_mb       = 2048     # JVM max heap (-Xmx)
timeout_seconds = 120      # per reasoner call
